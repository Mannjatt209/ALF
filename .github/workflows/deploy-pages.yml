name: Publish website to GitHub Pages

# GitHub Pages serves this site from the gh-pages branch.
# This workflow keeps gh-pages in sync with the development branch.
on:
  push:
    branches: [claude/ecstatic-bohr-txau7t, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: git push --force origin HEAD:gh-pages
